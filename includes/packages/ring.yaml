template:
  - sensor:
      - name: "Front Door Last Activity Date"
        icon: "mdi:clock"
        state: "{{ as_timestamp(state_attr('sensor.front_door_last_activity', 'created_at'), default=0) | timestamp_custom('%H:%M %d-%m-%Y') }}"

      - name: "Front Door Last Ding Date"
        icon: "mdi:clock"
        state: "{{ as_timestamp(state_attr('sensor.front_door_last_ding', 'created_at'), default=0) | timestamp_custom('%H:%M %d-%m-%Y') }}"

      - name: "Front Door Last Motion Date"
        icon: "mdi:clock"
        state: "{{ as_timestamp(state_attr('sensor.front_door_last_motion', 'created_at'), default=0) | timestamp_custom('%H:%M %d-%m-%Y') }}"

#downloader:
#  download_dir: downloads

automation:
  - id: "ring_doorbell"
    alias: "Ring DoorBell"
    initial_state: true
    trigger:
      platform: state
      entity_id: event.front_door_ding
#      entity_id: binary_sensor.front_door_ding
#      to: 'on'
    action:
      - service: notify.send_message
        data:
          entity_id: notify.telegram_vtel
          message: "\U0001F515 The doorbell rings !!!"

  - id: "ring_video_download"
    alias: "Ring Video Download"
    initial_state: true
    # rebuilt 2026-09-24: old template trigger on recording_status stopped catching events.
    # TEMP: still pointed at camera.front_door (not the newer, not-yet-appearing
    # camera.front_door_last_recording) so we can isolate whether the trigger itself fires,
    # independent of the has_subscription/video_url question - see project notes.
    trigger:
      - platform: state
        entity_id: event.front_door_ding
      - platform: state
        entity_id: event.front_door_motion
    action:
      - delay: "00:05:00"
      - condition: template
        value_template: "{{ (state_attr('camera.front_door', 'video_url') or '') | regex_match('^https?://') }}"
      - action: downloader.download_file
        data:
          url: "{{ state_attr('camera.front_door', 'video_url') }}"
          subdir: "ring_{{ now().strftime('%Y_%m_%d') }}"
          filename: "motion_{{ now().strftime('%Y_%m_%d_%H_%M') }}.mpg"
          overwrite: true
