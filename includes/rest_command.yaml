ha1_restart:
  url: "{{ states('input_text.ha1_url') }}api/services/homeassistant/restart"
  method: POST
  headers:
    authorization: !secret ha1_token

ha2_restart:
  url: "{{ states('input_text.ha2_url') }}api/services/homeassistant/restart"
  method: POST
  headers:
    authorization: !secret ha2_token

# --- Mikrotik reboot via RouterOS REST API (HTTP, www service) ---
mikrotik1_reboot:
  url: "http://192.168.1.1/rest/system/reboot"
  method: POST
  username: admin
  password: !secret mikrotik_admin_pass
  content_type: "application/json"
  payload: "{}"

mikrotik2_reboot:
  url: "http://192.168.1.249/rest/system/reboot"
  method: POST
  username: admin
  password: !secret mikrotik_admin_pass
  content_type: "application/json"
  payload: "{}"

mikrotik3_reboot:
  url: "http://192.168.1.254/rest/system/reboot"
  method: POST
  username: admin
  password: !secret mikrotik_admin_pass
  content_type: "application/json"
  payload: "{}"

