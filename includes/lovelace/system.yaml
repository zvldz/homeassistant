title: "System"
icon: "mdi:heart-pulse"
cards:
  - type: vertical-stack
    cards:
      - type: heading
        heading: "Home Assistant Status"
        icon: "mdi:home-assistant"
        card_mod:
          style: |
            div.container {
              justify-content: center;
              background-color: #203040;
            }

      - type: entities
        entities:
          - entity: sensor.myip
          - entity: sensor.last_boot
            format: total
          - entity: sensor.ha1_uptime
            format: total
          - entity: sensor.ha2_uptime
            format: total
          - entity: sensor.has_uptime
            format: total
          - entity: sensor.ha_fazenda_uptime
            format: total
#          - entity: sensor.ha_off_uptime
#            format: total
          - entity: sensor.ha_init
            name: HA Start Time
          - entity: sensor.ha_current
            name: HA Version
            type: custom:multiple-entity-row
            entities:
              - entity: sensor.ha_latest
                name: false
              - entity: sensor.ha_beta
                name: false

      - type: entities
        entities:
          - entity: sensor.total_entities_unavailable
            icon: "mdi:alert-circle"
          - type: custom:auto-entities
            card:
              type: custom:fold-entity-row
              head:
                type: section
                label: "Details"
              padding: 0
            filter:
              include:
                - entity_id: "*"
                  state: 'unavailable'
                  sort: name
                  options:
                    secondary_info: last-changed

  - type: vertical-stack
    cards:
      - type: heading
        heading: "System"
        icon: "mdi:heart-pulse"
        card_mod:
          style: |
            div.container {
              justify-content: center;
              background-color: #203040;
            }

      - type: horizontal-stack
        cards:
          - type: custom:mini-graph-card
            name: "Traffic"
            hour24: true
            points_per_hour: 30
            entities:
              - entity: sensor.mikrotik_ether1_rx
                name: RX
              - entity: sensor.mikrotik_ether1_tx
                name: TX

      - type: horizontal-stack
        cards:
          - type: custom:mini-graph-card
            name: "CPU temp"
            entities:
              - entity: sensor.cpu_temperature
            hour24: true
            line_color: red
          - type: custom:mini-graph-card
            name: "CPU use"
            hour24: true
            entities:
              - entity: sensor.processor_use

      - type: horizontal-stack
        cards:
          - type: custom:mini-graph-card
            name: "RAM"
            entities:
              - entity: sensor.memory_use_percent
            hour24: true
            line_color: red
          - type: custom:mini-graph-card
            name: "SWAP"
            hour24: true
            entities:
              - entity: sensor.swap_use_percent

      - type: horizontal-stack
        cards:
          - type: custom:mini-graph-card
            name: "HDD"
            hour24: true
            entities:
              - entity: sensor.disk_use_percent

  - type: vertical-stack
    cards:
      - type: heading
        heading: "Zigbee2MQTT"
        icon: "mdi:zigbee"
        card_mod:
          style: |
            div.container {
              justify-content: center;
              background-color: #203040;
            }

      - type: entities
        entities:
          - entity: switch.zigbee2mqtt_bridge_permit_join
            name: Zigbee2MQTT Join
          - entity: binary_sensor.zigbee2mqtt_bridge_connection_state
            name: Zigbee2MQTT
          - entity: sensor.zigbee2mqtt_bridge_version
            name: Zigbee2MQTT Version
            type: custom:multiple-entity-row
            entities:
              - entity: sensor.z2m_latest
                name: false
          - entity: sensor.zigbee2mqtt_bridge_coordinator_version

      - type: heading
        heading: "Mikrotik"
        icon: "mdi:router-network"
        card_mod:
          style: |
            div.container {
              justify-content: center;
              background-color: #203040;
            }

      - type: entities
        title: Firmware
        entities:
          - entity: update.mikrotik_rb951g_2hnd_routeros_update
            type: custom:multiple-entity-row
            name: "MT1 hEX PoE"
            show_state: false
            card_mod:
              style:
                hui-generic-entity-row$: |
                  state-badge {
                    transform: scale(0.6);
                    transform-origin: center;
                    filter: brightness(0) invert(1);
                  }
            entities:
              - entity: update.mikrotik_rb951g_2hnd_routerboard_firmware_update
                attribute: latest_version
                name: "RB↑"
              - entity: update.mikrotik_rb951g_2hnd_routerboard_firmware_update
                attribute: installed_version
                name: "RB"
              - entity: update.mikrotik_rb951g_2hnd_routeros_update
                attribute: latest_version
                name: "OS↑"
              - entity: update.mikrotik_rb951g_2hnd_routeros_update
                attribute: installed_version
                name: "OS"
          - entity: update.mikrotik2_hap_ax_3_routeros_update
            type: custom:multiple-entity-row
            name: "MT2 hAP ax3"
            show_state: false
            card_mod:
              style:
                hui-generic-entity-row$: |
                  state-badge {
                    transform: scale(0.6);
                    transform-origin: center;
                    filter: brightness(0) invert(1);
                  }
            entities:
              - entity: update.mikrotik2_hap_ax_3_routerboard_firmware_update
                attribute: latest_version
                name: "RB↑"
              - entity: update.mikrotik2_hap_ax_3_routerboard_firmware_update
                attribute: installed_version
                name: "RB"
              - entity: update.mikrotik2_hap_ax_3_routeros_update
                attribute: latest_version
                name: "OS↑"
              - entity: update.mikrotik2_hap_ax_3_routeros_update
                attribute: installed_version
                name: "OS"
          - entity: update.mikrotik3_cap_ax_routeros_update
            type: custom:multiple-entity-row
            name: "MT3 cAP ax"
            show_state: false
            card_mod:
              style:
                hui-generic-entity-row$: |
                  state-badge {
                    transform: scale(0.6);
                    transform-origin: center;
                    filter: brightness(0) invert(1);
                  }
            entities:
              - entity: update.mikrotik3_cap_ax_routerboard_firmware_update
                attribute: latest_version
                name: "RB↑"
              - entity: update.mikrotik3_cap_ax_routerboard_firmware_update
                attribute: installed_version
                name: "RB"
              - entity: update.mikrotik3_cap_ax_routeros_update
                attribute: latest_version
                name: "OS↑"
              - entity: update.mikrotik3_cap_ax_routeros_update
                attribute: installed_version
                name: "OS"

      - type: horizontal-stack
        cards:
          - type: tile
            entity: script.mikrotik1_update
            name: "Update MT1"
            icon: "mdi:package-up"
            hide_state: true
            card_mod:
              style: |
                ha-card {
                  {% if is_state('update.mikrotik_rb951g_2hnd_routeros_update','off') %}
                  opacity: 0.4;
                  pointer-events: none;
                  {% endif %}
                }
            tap_action:
              action: perform-action
              perform_action: script.mikrotik1_update
              confirmation:
                text: Are you sure you want to update RouterOS on Mikrotik1? It will reboot.

          - type: tile
            entity: script.mikrotik2_update
            name: "Update MT2"
            icon: "mdi:package-up"
            hide_state: true
            card_mod:
              style: |
                ha-card {
                  {% if is_state('update.mikrotik2_hap_ax_3_routeros_update','off') %}
                  opacity: 0.4;
                  pointer-events: none;
                  {% endif %}
                }
            tap_action:
              action: perform-action
              perform_action: script.mikrotik2_update
              confirmation:
                text: Are you sure you want to update RouterOS on Mikrotik2? It will reboot.

          - type: tile
            entity: script.mikrotik3_update
            name: "Update MT3"
            icon: "mdi:package-up"
            hide_state: true
            card_mod:
              style: |
                ha-card {
                  {% if is_state('update.mikrotik3_cap_ax_routeros_update','off') %}
                  opacity: 0.4;
                  pointer-events: none;
                  {% endif %}
                }
            tap_action:
              action: perform-action
              perform_action: script.mikrotik3_update
              confirmation:
                text: Are you sure you want to update RouterOS on Mikrotik3? It will reboot.

      - type: horizontal-stack
        cards:
          - type: tile
            entity: script.mikrotik1_reboot
            name: "Reboot MT1"
            icon: "mdi:restart"
            hide_state: true
            tap_action:
              action: perform-action
              perform_action: script.mikrotik1_reboot
              confirmation:
                text: Are you sure you want to reboot Mikrotik1?

          - type: tile
            entity: script.mikrotik2_reboot
            name: "Reboot MT2"
            icon: "mdi:restart"
            hide_state: true
            tap_action:
              action: perform-action
              perform_action: script.mikrotik2_reboot
              confirmation:
                text: Are you sure you want to reboot Mikrotik2?

          - type: tile
            entity: script.mikrotik3_reboot
            name: "Reboot MT3"
            icon: "mdi:restart"
            hide_state: true
            tap_action:
              action: perform-action
              perform_action: script.mikrotik3_reboot
              confirmation:
                text: Are you sure you want to reboot Mikrotik3?

      - type: heading
        heading: "Maintenance"
        icon: "mdi:wrench-clock"
        card_mod:
          style: |
            div.container {
              justify-content: center;
              background-color: #203040;
            }

      - type: horizontal-stack
        cards:
          - type: tile
            entity: script.ha1_restart
            name: "Restart HA1"
            icon: "mdi:rotate-3d-variant"
            hide_state: true
            tap_action:
              action: perform-action
              perform_action: script.ha1_restart
              confirmation:
                text: Are you sure you want to restart HA1?

          - type: tile
            entity: script.ha2_restart
            name: "Restart HA2"
            icon: "mdi:rotate-3d-variant"
            hide_state: true
            tap_action:
              action: perform-action
              perform_action: script.ha2_restart
              confirmation:
                text: Are you sure you want to restart HA2?

      - type: horizontal-stack
        cards:
          - type: tile
            name: "Power HAS"
            entity: switch.gosund_socket_2
            tap_action:
              action: toggle
              confirmation:
                text: Are you sure you want to toggle HAS power?

          - type: tile
            name: "Power HAF"
            entity: switch.fazenda_socket
            tap_action:
              action: toggle
              confirmation:
                text: Are you sure you want to toggle HAF power?

      - type: horizontal-stack
        cards:
          - type: tile
            entity: script.purge_db_0d
            name: "Purge DB to 0 d"
            icon: "mdi:database-refresh-outline"
            hide_state: true
            vertical: true
            tap_action:
              action: perform-action
              perform_action: script.purge_db_0d
              confirmation:
                text: Are you sure you want to purge DB to 0 days?

          - type: tile
            entity: script.purge_db_1d
            name: "Purge DB to 1 d"
            icon: "mdi:database-refresh-outline"
            hide_state: true
            vertical: true
            tap_action:
              action: perform-action
              perform_action: script.purge_db_1d
              confirmation:
                text: Are you sure you want to purge DB to 1 days?

          - type: tile
            entity: script.purge_db_2d
            name: "Purge DB to 2 d"
            icon: "mdi:database-refresh-outline"
            hide_state: true
            vertical: true
            tap_action:
              action: perform-action
              perform_action: script.purge_db_2d
              confirmation:
                text: Are you sure you want to purge DB to 2 days?

