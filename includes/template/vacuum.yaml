# On a vacuum error: store room + error + weekday.
# Kept in the 'history' attribute (last 60 entries) - outlives the recorder purge (3 days).
- trigger:
    - platform: state
      entity_id: vacuum.saros_20
      to: "error"
  sensor:
    - name: "Vacuum Error Log"
      unique_id: vacuum_error_log
      icon: mdi:map-marker-alert
      state: >
        {{ states('sensor.saros_20_vacuum_error') }} @ {{ states('sensor.saros_20_current_room') }}
      attributes:
        last_error: "{{ states('sensor.saros_20_vacuum_error') }}"
        last_room: "{{ states('sensor.saros_20_current_room') }}"
        last_weekday: "{{ now().strftime('%A') }}"
        last_time: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
        history: >
          {% set prev = this.attributes.get('history', []) if this is defined and this.attributes is mapping else [] %}
          {% set entry = {
            't': now().strftime('%Y-%m-%d %H:%M'),
            'wd': now().strftime('%a'),
            'room': states('sensor.saros_20_current_room'),
            'err': states('sensor.saros_20_vacuum_error') } %}
          {{ (prev + [entry])[-60:] }}

# Roborock exposes consumable time-left as floats with ~12 decimal digits
# (e.g. 149.168888888889) which overflows the vacuum-card stats column.
# Rounded display-only copies for the dashboard; raw sensors stay untouched.
- sensor:
    - name: "Saros 20 Filter Time Left (rounded)"
      unique_id: saros_20_filter_time_left_rounded
      unit_of_measurement: "h"
      device_class: duration
      state: "{{ states('sensor.saros_20_filter_time_left') | float(0) | round(0) }}"
      availability: "{{ states('sensor.saros_20_filter_time_left') not in ['unknown', 'unavailable'] }}"

    - name: "Saros 20 Side Brush Time Left (rounded)"
      unique_id: saros_20_side_brush_time_left_rounded
      unit_of_measurement: "h"
      device_class: duration
      state: "{{ states('sensor.saros_20_side_brush_time_left') | float(0) | round(0) }}"
      availability: "{{ states('sensor.saros_20_side_brush_time_left') not in ['unknown', 'unavailable'] }}"

    - name: "Saros 20 Main Brush Time Left (rounded)"
      unique_id: saros_20_main_brush_time_left_rounded
      unit_of_measurement: "h"
      device_class: duration
      state: "{{ states('sensor.saros_20_main_brush_time_left') | float(0) | round(0) }}"
      availability: "{{ states('sensor.saros_20_main_brush_time_left') not in ['unknown', 'unavailable'] }}"

    - name: "Saros 20 Sensor Time Left (rounded)"
      unique_id: saros_20_sensor_time_left_rounded
      unit_of_measurement: "h"
      device_class: duration
      state: "{{ states('sensor.saros_20_sensor_time_left') | float(0) | round(0) }}"
      availability: "{{ states('sensor.saros_20_sensor_time_left') not in ['unknown', 'unavailable'] }}"

    - name: "Saros 20 Cleaning Time (rounded)"
      unique_id: saros_20_cleaning_time_rounded
      unit_of_measurement: "min"
      device_class: duration
      state: "{{ states('sensor.saros_20_cleaning_time') | float(0) | round(0) | int }}"
      availability: "{{ states('sensor.saros_20_cleaning_time') not in ['unknown', 'unavailable'] }}"
