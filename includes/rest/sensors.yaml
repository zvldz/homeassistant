- resource_template: "{{ states('input_text.ha_fazenda_url') }}api/states/sensor.nodemcu_4_outdoor_temperature"
  headers:
    authorization: !secret ha_fazenda_token
  sensor:
    - name: fazenda_outdoor_temperature
      unit_of_measurement: "°C"
      device_class: temperature
      force_update: true
      value_template: >
        {% if states('input_text.ha_fazenda_url') not in ['unknown', 'unavailable'] and value_json is defined and value_json.state not in ['unknown', 'unavailable', None, ''] %}
          {{ value_json.state | float | round(2) }}
        {% endif %}
      json_attributes:
        - state

- resource: https://api.github.com/repos/esphome/esphome/releases/latest
  scan_interval: 1800
  sensor:
    - name: "ESPHome Latest"
      icon: "mdi:car-esp"
      value_template: "{{ value_json.tag_name }}"
