# On a vacuum error: refresh the position (REST), then store coordinates + error + weekday.
# Kept in the 'history' attribute (last 60 entries) - outlives the recorder purge (3 days).
- trigger:
    - platform: state
      entity_id: vacuum.valetudo_rockrobo
      to: "error"
  action:
    - service: homeassistant.update_entity
      target:
        entity_id: sensor.vacuum_robot_position
    - delay: "00:00:03"
  sensor:
    - name: "Vacuum Error Log"
      unique_id: vacuum_error_log
      icon: mdi:map-marker-alert
      state: >
        {{ states('sensor.vacuum_error_text') }} @ {{ states('sensor.vacuum_robot_position') }}
      attributes:
        last_error: "{{ states('sensor.vacuum_error_text') }}"
        # both sources raw, so a mismatch between them stays visible
        last_error_valetudo: "{{ states('sensor.valetudo_rockrobo_error') }}"
        last_error_xiaomi: "{{ states('sensor.vacuum_cleaner_error_sensor') }}"
        last_position: "{{ states('sensor.vacuum_robot_position') }}"
        last_weekday: "{{ now().strftime('%A') }}"
        last_time: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
        history: >
          {% set prev = this.attributes.get('history', []) if this is defined and this.attributes is mapping else [] %}
          {% set entry = {
            't': now().strftime('%Y-%m-%d %H:%M'),
            'wd': now().strftime('%a'),
            'pos': states('sensor.vacuum_robot_position'),
            'err': states('sensor.vacuum_error_text') } %}
          {{ (prev + [entry])[-60:] }}

# Single error text: Valetudo often flaps between the real message and the
# "Unknown error undefined" placeholder (2026-08-10: 8 switches in 20 seconds),
# while the Xiaomi integration gives a stable human-readable one. Prefer Valetudo,
# fall back to Xiaomi when it is the placeholder or empty.
- sensor:
    - name: "Vacuum Error Text"
      unique_id: vacuum_error_text
      icon: mdi:alert-circle-outline
      state: >
        {% set v = states('sensor.valetudo_rockrobo_error') %}
        {% set x = states('sensor.vacuum_cleaner_error_sensor') %}
        {% set bad = ['Unknown error undefined', 'unknown', 'unavailable', 'none', 'None', ''] %}
        {% if v not in bad and v not in ['No error'] %}
          {{ v }}
        {% elif x not in bad and x != 'No Error' %}
          {{ x }}
        {% elif v == 'No error' or x == 'No Error' %}
          No error
        {% else %}
          {{ v }}
        {% endif %}
