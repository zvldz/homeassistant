input_boolean:
  vacuum_schedule:
    name: "Regular robot cleaning"
    icon: "mdi:timer-outline"
  vacuum_notification:
    name: "Messages from the robot"
    icon: "mdi:bell"

automation:
  - alias: "Vacuum Time Clean 1"
    initial_state: true
    trigger:
      - platform: time
        at: '13:00:00'
    condition:
      - condition: state
        entity_id: input_boolean.vacuum_schedule
        state: 'on'
      - condition: time
        weekday:
          - mon
          - wed
          - fri
      - condition: state
        entity_id: group.persons
        state: 'not_home'
    action:
      - service: script.saros_clean_all_except_balcony

  # Tue/Thu: deep mop of kitchen + hallway
  - alias: "Vacuum Time Clean 2"
    initial_state: true
    trigger:
      - platform: time
        at: '13:00:00'
    condition:
      - condition: state
        entity_id: input_boolean.vacuum_schedule
        state: 'on'
      - condition: time
        weekday:
          - tue
          - thu
      - condition: state
        entity_id: group.persons
        state: 'not_home'
    action:
      # turn_on so the automation does not wait for the whole run
      - service: script.turn_on
        target:
          entity_id: script.saros_clean_kitchen_hallway_deep

  - alias: "Vacuum Cleaning"
    initial_state: true
    trigger:
      - platform: state
        entity_id: vacuum.saros_20
        to: 'cleaning'
    condition:
      - condition: state
        entity_id: input_boolean.vacuum_notification
        state: 'on'
    action:
      - service: telegram_bot.send_message
        data:
          disable_notification: true
          chat_id: !secret telegram_bot_allowed_chat_id1
          message: "Vacuum cleaner started cleaning"

  - alias: "Vacuum Returning"
    initial_state: true
    trigger:
      - platform: state
        entity_id: vacuum.saros_20
        to: 'returning'
    condition:
      - condition: state
        entity_id: input_boolean.vacuum_notification
        state: 'on'
    action:
      - service: telegram_bot.send_message
        data:
          disable_notification: true
          chat_id: !secret telegram_bot_allowed_chat_id1
          message: "Vacuum cleaner has finished cleaning and is returning to the base. Cleaning time: {{ states('sensor.saros_20_cleaning_time_rounded') }} min. Total cleaning area: {{ states('sensor.saros_20_cleaning_area') }} m²"

  - alias: "Vacuum Docked"
    initial_state: true
    trigger:
      - platform: state
        entity_id: vacuum.saros_20
        to: 'docked'
    condition:
      - condition: state
        entity_id: input_boolean.vacuum_notification
        state: 'on'
    action:
      - service: telegram_bot.send_message
        data:
          disable_notification: true
          chat_id: !secret telegram_bot_allowed_chat_id1
          message: "Vacuum cleaner docked and charging."

  - alias: "Vacuum Cleaner Error"
    initial_state: true
    trigger:
      - platform: state
        entity_id: vacuum.saros_20
        to: 'error'
    action:
      - service: notify.send_message
        data:
          entity_id: notify.telegram_vtel
          message: >-
            Vacuum error: {{ states('sensor.saros_20_vacuum_error') }} (room: {{ states('sensor.saros_20_current_room') }})

  - alias: "Vacuum Cleaner Error Solved"
    initial_state: true
    trigger:
      - platform: state
        entity_id: sensor.saros_20_vacuum_error
        to: 'none'
    condition:
      condition: template
      value_template: "{{ states('sensor.ha_uptime') | int > 10 }}"
    action:
      - service: notify.send_message
        data:
          entity_id: notify.telegram_vtel
          message: "Vacuum cleaner error solved"

  # Time-left counters are "norm minus work time" and go negative once overdue
  - alias: "Vacuum Consumable Worn Out"
    initial_state: true
    trigger:
      - platform: numeric_state
        entity_id:
          - sensor.saros_20_filter_time_left
          - sensor.saros_20_side_brush_time_left
          - sensor.saros_20_main_brush_time_left
          - sensor.saros_20_sensor_time_left
          - sensor.saros_20_dock_strainer_time_left
        below: 0.5
    action:
      - service: notify.send_message
        data:
          entity_id: notify.telegram_vtel
          message: >-
            {{ "\U0001F9F9" }} Saros 20: {{ trigger.to_state.name | replace('Saros 20 ', '') }} -
            {{ trigger.to_state.state | float(0) | round(0) }} h left, clean or replace it
            and reset the counter

  - alias: "Hallway Button Click Single"
    initial_state: true
    trigger:
      - platform: state
        entity_id: sensor.0x00158d0002e22617_action
        to: 'single'
    action:
      - service: script.saros_clean_hallway

  - alias: "Hallway Button Click Double"
    initial_state: true
    trigger:
      - platform: state
        entity_id: sensor.0x00158d0002e22617_action
        to: 'double'
    action:
      - service: script.saros_clean_all_except_balcony

  - alias: "Kitchen Button Click Long"
    initial_state: true
    trigger:
      - platform: state
        entity_id: sensor.0x38398ffffe1ff367_action
        to: 'long'
    action:
      - service: script.saros_clean_kitchen


# vacuum.clean_area takes HA area ids; area -> Saros segment mapping lives in the
# vacuum.saros_20 entity registry options. Areas: b210...=Balcony, 3c44...=Hallway,
# a808...=Master Bedroom, 7a21...=Kitchen, ac10...=Bedroom, 7d45...=Livingroom.
script:
  saros_clean_all:
    alias: "Saros: Clean All"
    sequence:
      - service: vacuum.start
        target:
          entity_id: vacuum.saros_20
      - condition: state
        entity_id: input_boolean.vacuum_notification
        state: 'on'
      - service: telegram_bot.send_message
        data:
          disable_notification: true
          chat_id: !secret telegram_bot_allowed_chat_id1
          message: "Saros 20: Clean All"

  # Two passes per room; raw app_segment_clean because vacuum.clean_area has no repeat option.
  # Segment ids: 4=Kitchen, 2=Hallway, 7=Livingroom, 3=Master Bedroom, 6=Bedroom.
  saros_clean_all_except_balcony:
    alias: "Saros: Clean All Except Balcony"
    sequence:
      - service: vacuum.send_command
        target:
          entity_id: vacuum.saros_20
        data:
          command: app_segment_clean
          params:
            - segments: [4, 2, 7, 3, 6]
              repeat: 2
      - condition: state
        entity_id: input_boolean.vacuum_notification
        state: 'on'
      - service: telegram_bot.send_message
        data:
          disable_notification: true
          chat_id: !secret telegram_bot_allowed_chat_id1
          message: "Saros 20: Clean All Except Balcony"

  saros_clean_balcony:
    alias: "Saros: Clean Balcony"
    sequence:
      - service: vacuum.clean_area
        target:
          entity_id: vacuum.saros_20
        data:
          cleaning_area_id:
            - b210ed64f7ff11eaae95a1aab327b97b
      - condition: state
        entity_id: input_boolean.vacuum_notification
        state: 'on'
      - service: telegram_bot.send_message
        data:
          disable_notification: true
          chat_id: !secret telegram_bot_allowed_chat_id1
          message: "Saros 20: Clean Balcony"

  saros_clean_hallway:
    alias: "Saros: Clean Hallway"
    sequence:
      - service: vacuum.clean_area
        target:
          entity_id: vacuum.saros_20
        data:
          cleaning_area_id:
            - 3c44438b6f7145bfb5237492db72f827
      - condition: state
        entity_id: input_boolean.vacuum_notification
        state: 'on'
      - service: telegram_bot.send_message
        data:
          disable_notification: true
          chat_id: !secret telegram_bot_allowed_chat_id1
          message: "Saros 20: Clean Hallway"

  # Hard floors get a stronger mop setup and two passes; mop settings are global
  # for the robot, so they are restored once the run is over. Raw
  # app_segment_clean is used because vacuum.clean_area has no repeat option.
  # Segment ids: 4=Kitchen, 2=Hallway.
  saros_clean_kitchen_hallway_deep:
    alias: "Saros: Deep Clean Kitchen + Hallway"
    mode: single
    fields:
      segments:
        description: "Saros segment ids to clean (default kitchen + hallway)"
        example: "[2]"
    sequence:
      - service: select.select_option
        target:
          entity_id: select.saros_20_mop_mode
        data:
          option: deep_plus
      - service: select.select_option
        target:
          entity_id: select.saros_20_mop_intensity
        data:
          option: high
      - service: vacuum.send_command
        target:
          entity_id: vacuum.saros_20
        data:
          command: app_segment_clean
          params:
            - segments: "{{ segments | default([4, 2]) }}"
              repeat: 2
      - if:
          - condition: state
            entity_id: input_boolean.vacuum_notification
            state: 'on'
        then:
          - service: telegram_bot.send_message
            data:
              disable_notification: true
              chat_id: !secret telegram_bot_allowed_chat_id1
              message: "Saros 20: Deep Clean Kitchen + Hallway"
      # binary_sensor.saros_20_cleaning stays on through mid-run mop washes at the dock
      - wait_template: "{{ is_state('binary_sensor.saros_20_cleaning', 'on') }}"
        timeout: "00:03:00"
        continue_on_timeout: true
      - wait_template: "{{ is_state('binary_sensor.saros_20_cleaning', 'off') }}"
        timeout: "04:00:00"
        continue_on_timeout: true
      - service: select.select_option
        target:
          entity_id: select.saros_20_mop_mode
        data:
          option: standard
      - service: select.select_option
        target:
          entity_id: select.saros_20_mop_intensity
        data:
          option: medium

  saros_clean_master_bedroom:
    alias: "Saros: Clean Master Bedroom"
    sequence:
      - service: vacuum.clean_area
        target:
          entity_id: vacuum.saros_20
        data:
          cleaning_area_id:
            - a8083040f7ff11eabdb0a5bf0547ce23
      - condition: state
        entity_id: input_boolean.vacuum_notification
        state: 'on'
      - service: telegram_bot.send_message
        data:
          disable_notification: true
          chat_id: !secret telegram_bot_allowed_chat_id1
          message: "Saros 20: Clean Master Bedroom"

  saros_clean_kitchen:
    alias: "Saros: Clean Kitchen"
    sequence:
      - service: vacuum.clean_area
        target:
          entity_id: vacuum.saros_20
        data:
          cleaning_area_id:
            - 7a21bf6d6f2f49cbb95dc979c4e08cd6
      - condition: state
        entity_id: input_boolean.vacuum_notification
        state: 'on'
      - service: telegram_bot.send_message
        data:
          disable_notification: true
          chat_id: !secret telegram_bot_allowed_chat_id1
          message: "Saros 20: Clean Kitchen"

  saros_clean_bedroom:
    alias: "Saros: Clean Bedroom"
    sequence:
      - service: vacuum.clean_area
        target:
          entity_id: vacuum.saros_20
        data:
          cleaning_area_id:
            - ac10aa96f7ff11ea915c6fd394ce1b8a
      - condition: state
        entity_id: input_boolean.vacuum_notification
        state: 'on'
      - service: telegram_bot.send_message
        data:
          disable_notification: true
          chat_id: !secret telegram_bot_allowed_chat_id1
          message: "Saros 20: Clean Bedroom"

  saros_clean_living_room:
    alias: "Saros: Clean Living Room"
    sequence:
      - service: vacuum.clean_area
        target:
          entity_id: vacuum.saros_20
        data:
          cleaning_area_id:
            - 7d4532ff206a4949971d86119a1e3a99
      - condition: state
        entity_id: input_boolean.vacuum_notification
        state: 'on'
      - service: telegram_bot.send_message
        data:
          disable_notification: true
          chat_id: !secret telegram_bot_allowed_chat_id1
          message: "Saros 20: Clean Living Room"
