# CPU Temperature moved to host-specific packages (main.yaml on ha1 / reserve_control.yaml on ha2)
# — thermal zone differs by hardware. This file stays universal.
- sensor:
    name: "HA Init"
    command: 'grep -m 1 -o "initialized[[:space:]]in[[:space:]][0-9]\+.[0-9]\+" /config/home-assistant.log | grep -o "[0-9]\+.[0-9]\+$" || echo -1'
    scan_interval: 120
    unit_of_measurement: "sec"
